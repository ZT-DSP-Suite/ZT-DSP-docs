name: Documentation defect
description: The Master Guide or one of its appendices is wrong or inconsistent
labels: [bug]
body:
  - type: textarea
    id: audience
    attributes:
      label: 谁受影响？
      description: 谁会遇到这个问题，例如使用者、维护者、评审人
    validations:
      required: true
  - type: textarea
    id: if-skipped
    attributes:
      label: 不读会错过什么？
      description: 漏掉哪条信息会导致什么后果，例如复现条件、版本、影响面
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        For a security vulnerability use the private route in SECURITY.md instead.
        Do not paste keys, PSKs or private paths.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of defect
      options:
        - Text contradicts the implementation
        - Chinese and English mirror disagree
        - Internal contradiction within one document
        - Wrong or stale number, path or version
        - Formatting, structure or rendering
        - Other
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: File path and section or line, for example the specification section 4.2.4
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it says now, and what it should say
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Quote the lines, and if the implementation disagrees, cite the file and line
    validations:
      required: true
